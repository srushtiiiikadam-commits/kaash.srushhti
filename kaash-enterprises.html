  template:'<div class="formbox" id="quote"><h3 style="font-size:28px">Get a Quote</h3><div class="two"><div><label>Name</label><input v-model="n" autocomplete="name"></div><div><label>Phone</label><input v-model="p" type="tel" autocomplete="tel"></div></div><div class="two"><div><label>Product</label><select v-model="t"><option>Chef Coats</option><option>Cook Shirts</option><option>Vests</option><option>Chef Pants</option><option>Hats &amp; Accessories</option><option>Aprons</option><option>Knife Rolls</option><option>Other</option></select></div><div><label>Approx. quantity</label><input v-model="qty" inputmode="numeric"></div></div><label>Details</label><textarea rows="4" v-model="m"></textarea><div v-if="sent" style="color:var(--gold);margin-top:10px">Thank you, we have received your enquiry and will call you soon.</div><div v-if="err" class="err">{{err}}</div><div class="cta" style="margin-top:20px"><button v-if="dbOk" class="btn red" @click="save">Send Enquiry</button><button class="btn red" @click="wa">Send on WhatsApp</button><button class="btn line" @click="mail">Send by Email</button></div></div>'}).mount(q);

d.collection('enquiries').onSnapshot(function(s){p.textContent='';var all=[];s.docs.forEach(function(x){((x.data()||{}).items||[]).forEach(function(i){all.push(i)})});all.sort(function(a,b){return b.at-a.at});var h3=document.createElement('h3');h3.textContent='Enquiries ('+all.length+')';p.append(h3);
